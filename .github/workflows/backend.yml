name: backend

# The verification gate. Runs the offline smoke tier, which needs no
# credentials, no server, and no network — so there are no secrets to manage
# and nothing to spend. See AGENTS.md.

on:
  push:
    branches: [Kanary, main]
  pull_request:
    branches: [Kanary, main]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  smoke:
    name: smoke test (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync locked dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml, rather
        # than silently re-resolving and testing something nobody committed.
        run: uv sync --locked

      - name: Smoke test
        # Checks that docs/openapi.json matches the code and that the
        # contract's validation rules hold. Exits non-zero on any failure.
        run: uv run python scripts/smoke_test.py

      - name: Confirm generated schema is current
        # Redundant with the smoke test, but fails with a message that names
        # the fix, which is what a contributor actually needs to see.
        run: uv run python scripts/export_openapi.py --check

      - name: Strokes-gained gates
        # Conservation, totality, and self-play zero-mean on the live SG path.
        # Offline: reads the committed surface cache, simulates, asserts.
        run: uv run python scripts/verify_sg.py
